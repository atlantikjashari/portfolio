<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#05060a;color:#e8eaf2;font-family:'Space Grotesk',sans-serif;position:relative;overflow:hidden}
.b{position:absolute;border-radius:50%;filter:blur(110px)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 30% 50%,#000 20%,transparent 75%)}
.c{position:absolute;left:80px;top:96px;right:80px}
.mono{font-family:'JetBrains Mono',monospace;color:#22d3ee;font-size:22px;letter-spacing:.25em;text-transform:uppercase}
h1{font-size:104px;font-weight:700;line-height:1;margin-top:28px;color:#fff;letter-spacing:-2px}
h2{font-size:58px;font-weight:700;margin-top:14px;background:linear-gradient(100deg,#22d3ee,#a78bfa 45%,#f472b6);-webkit-background-clip:text;color:transparent}
p{margin-top:34px;font-size:28px;color:#9aa1b5;font-weight:500}
.chips{position:absolute;left:80px;bottom:70px;display:flex;gap:12px}
.chip{font-family:'JetBrains Mono',monospace;font-size:20px;color:#c9cede;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);padding:8px 16px;border-radius:999px}
.logo{position:absolute;right:80px;top:80px;width:110px;height:110px;border-radius:28px;background:linear-gradient(135deg,#22d3ee,#a78bfa);display:grid;place-items:center;font-weight:700;font-size:48px;color:#05060a;box-shadow:0 0 80px -10px rgba(34,211,238,.7)}
</style></head><body>
<div class="b" style="width:700px;height:700px;left:-200px;top:-250px;background:rgba(167,139,250,.35)"></div>
<div class="b" style="width:600px;height:600px;right:-200px;top:80px;background:rgba(34,211,238,.25)"></div>
<div class="b" style="width:500px;height:500px;left:350px;bottom:-350px;background:rgba(244,114,182,.18)"></div>
<div class="grid"></div>
<div class="logo">AJ</div>
<div class="c">
  <div class="mono">Portfolio · Pristina, Kosovo</div>
  <h1>Atlantik Jashari</h1>
  <h2>Software Engineer</h2>
  <p>Vue/Nuxt &amp; React/Next.js frontends · Django REST APIs</p>
</div>
<div class="chips"><span class="chip">TypeScript</span><span class="chip">Nuxt</span><span class="chip">Next.js</span><span class="chip">Django · DRF</span><span class="chip">GraphQL</span></div>
</body></html>
